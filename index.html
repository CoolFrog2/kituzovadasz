<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5130">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kitűzővadász">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Jövőbeli teljesítménytúrák térképen — kitűző, érem, jelvény, oklevél. Szűrhető táv, szint, körtúra szerint.">
  <title>Kitűzővadász — teljesítménytúrák térképen</title>
  <link rel="manifest" href="/kituzovadasz/static/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/kituzovadasz/static/img/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/kituzovadasz/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/kituzovadasz/a/app.6833dd012f.css">
  <script>window.B = "/kituzovadasz"; window.PUB = "https://coolfrog2.github.io/kituzovadasz/";</script>
  
<link rel="stylesheet" href="/kituzovadasz/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/kituzovadasz/static/vendor/markercluster/MarkerCluster.css">

</head>
<body class="app">

<header class="topbar">
  <a class="brand" href="/kituzovadasz/rolunk" aria-label="Rólunk">
    <img src="/kituzovadasz/static/img/icon.svg" alt="" width="28" height="28">
    <span>Kitűzővadász</span>
  </a>
  <div class="count" id="count" aria-live="polite">…</div>
  <a class="news-btn" href="/kituzovadasz/tervezo" aria-label="Körtúra-tervező">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 18H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m16 1.5 2.5 2.5L16 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <a class="news-btn" href="/kituzovadasz/hirek" aria-label="Hírek">
    <svg viewBox="0 0 24 24"><path d="M3 10v4a1 1 0 0 0 1 1h2l5 4V5L6 9H4a1 1 0 0 0-1 1zM15 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <i id="newsDot" hidden></i>
  </a>
</header>
<div class="alerts" id="alerts"></div>

<main>
  <section id="view-map" class="view active" aria-label="Térkép">
    <div id="map"></div>
    <button class="fab" id="btnLocate" aria-label="Helyzetem">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="map-chips quick" id="mapChips"></div>
    <div class="peek" id="peek" hidden></div>
  </section>

  <section id="view-list" class="view" aria-label="Lista">
    <div class="list-tools">
      <input type="search" id="q" placeholder="Keresés: név, hely, táj…" autocomplete="off" enterkeyhint="search">
      <select id="sort" aria-label="Rendezés">
        <option value="date">Dátum szerint</option>
        <option value="near">Közelség szerint</option>
        <option value="km">Táv szerint</option>
      </select>
    </div>
    <div class="quick list-quick" id="listChips"></div>
    <div class="loc-banner" id="locBanner" hidden>
      <svg class="lb-pin"><use href="#i-pin"/></svg>
      <div><b>Mennyire van messze?</b><br><small>Engedd a helyadatot, és minden túránál látod a távolságot. A helyzeted nem hagyja el a telefonod.</small></div>
      <div class="lb-act"><button class="btn sm" id="locYes">Mutasd</button><button class="lb-x" id="locNo" aria-label="Nem kérem">×</button></div>
    </div>
    <div id="list"></div>
  </section>

  <section id="view-filter" class="view" aria-label="Szűrők">
    <div class="filters">
      <div class="f-group zsolti">
        <label class="toggle"><input type="checkbox" id="zsolti"><span><b>Zsolti kompatibilitás mód</b><br><small id="zsoltiInfo"></small></span></label>
      </div>

      <div class="f-group">
        <h3>Mikor?</h3>
        <div class="chips" data-f="when">
          <button data-v="all">Bármikor</button>
          <button data-v="weekend">Ez a hétvége</button>
          <button data-v="30">30 napon belül</button>
          <button data-v="90">3 hónapon belül</button>
          <button data-v="custom">Dátumtól–ig</button>
        </div>
        <div class="dates" id="customDates" hidden>
          <label>Tól <input type="date" id="dFrom"></label>
          <label>Ig <input type="date" id="dTo"></label>
        </div>
      </div>

      <div class="f-group">
        <h3>Táv <output id="kmOut"></output></h3>
        <div class="dual" id="kmRange">
          <input type="range" min="0" max="110" step="1" id="kmMin" aria-label="Minimum táv">
          <input type="range" min="0" max="110" step="1" id="kmMax" aria-label="Maximum táv">
        </div>
        <div class="chips small" data-preset="km">
          <button data-v="0-15">15 alatt</button>
          <button data-v="15-30">15–30</button>
          <button data-v="30-50">30–50</button>
          <button data-v="50-110">50 felett</button>
        </div>
      </div>

      <div class="f-group">
        <h3>Szintemelkedés legfeljebb <output id="ascOut"></output></h3>
        <input type="range" min="100" max="3100" step="100" id="ascMax" class="single">
      </div>

      <div class="f-group">
        <h3>Útvonal</h3>
        <div class="seg" data-f="round">
          <button data-v="all">Mind</button>
          <button data-v="loop">Körtúra</button>
          <button data-v="ab">A → B</button>
        </div>
      </div>

      <div class="f-group">
        <h3>Díjazás <small>(bármelyik jár)</small></h3>
        <div class="chips awards" data-f="aw" data-multi>
          <button data-v="kituzo"><svg><use href="#i-kituzo"/></svg>Kitűző</button>
          <button data-v="erem"><svg><use href="#i-erem"/></svg>Érem</button>
          <button data-v="jelveny"><svg><use href="#i-jelveny"/></svg>Jelvény</button>
          <button data-v="egyeb"><svg><use href="#i-egyeb"/></svg>Egyéb tárgy</button>
          <button data-v="oklevel"><svg><use href="#i-oklevel"/></svg>Oklevél</button>
        </div>
        <label class="toggle"><input type="checkbox" id="yearly"><span>Csak évente változó díjazás <small>(gyűjtőknek)</small></span></label>
      </div>

      <div class="f-group">
        <h3>Napszak</h3>
        <div class="seg" data-f="night">
          <button data-v="all">Mind</button>
          <button data-v="day">Nappali</button>
          <button data-v="night">Éjszakai</button>
        </div>
      </div>

      <div class="f-group">
        <h3>Közelemben</h3>
        <button class="btn-line" id="btnGeo">Helyzetem használata</button>
        <div class="chips small" data-f="radius" id="radiusChips" hidden>
          <button data-v="25">25 km</button>
          <button data-v="50">50 km</button>
          <button data-v="100">100 km</button>
          <button data-v="200">200 km</button>
          <button data-v="0">Bárhol</button>
        </div>
      </div>

      <div class="f-group">
        <h3>Egyéb</h3>
        <label class="toggle"><input type="checkbox" id="walkin"><span>Helyszínen is lehet nevezni</span></label>
        <label class="toggle"><input type="checkbox" id="runok"><span>Futni is lehet</span></label>
        <label class="toggle"><input type="checkbox" id="huOnly"><span>Csak Magyarország</span></label>
        <label class="toggle"><input type="checkbox" id="favOnly"><span>Csak a csillagozottak ★</span></label>
        <label class="toggle"><input type="checkbox" id="showCanceled"><span>Elmaradt túrák is</span></label>
        <div class="price">
          <h3>Nevezési díj legfeljebb <output id="priceOut"></output></h3>
          <input type="range" min="1000" max="16000" step="500" id="priceMax" class="single">
        </div>
      </div>

      <div class="f-actions">
        <button class="btn-line" id="btnReset">Alaphelyzet</button>
        <button class="btn" id="btnApply">Mutasd (<span id="applyCount">0</span>)</button>
      </div>
      <p class="f-foot"><a href="/kituzovadasz/rolunk">Honnan jön az adat?</a> · <a href="/kituzovadasz/valtozasok">Mi változott?</a></p>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="map" class="active">
    <svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5zM9 4v13.5M15 6.5V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Térkép</span>
  </button>
  <button data-view="list">
    <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="3.5" cy="6" r="1.5" fill="currentColor"/><circle cx="3.5" cy="12" r="1.5" fill="currentColor"/><circle cx="3.5" cy="18" r="1.5" fill="currentColor"/></svg>
    <span>Lista</span>
  </button>
  <button data-view="filter">
    <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8.5V20l-4-2v-4.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Szűrők</span><b class="badge" id="fbadge" hidden></b>
  </button>
</nav>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-kituzo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="currentColor"/></symbol>
    <symbol id="i-jelveny" viewBox="0 0 24 24"><path d="M12 2.5 20 6v6c0 4.6-3.3 8.3-8 9.5C7.3 20.3 4 16.6 4 12V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m12 7.5 1.4 2.9 3.1.4-2.3 2.2.6 3.1L12 14.6l-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z" fill="currentColor"/></symbol>
    <symbol id="i-erem" viewBox="0 0 24 24"><path d="M7 2h4l2 6H9zM13 2h4l-2 6h-4z" fill="currentColor" opacity=".55"/><circle cx="12" cy="15" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="15" r="3" fill="currentColor"/></symbol>
    <symbol id="i-oklevel" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-egyeb" viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 9h19M12 9v11.5M12 9c-1.5-4-6-4.5-6-1.8C6 9 12 9 12 9zm0 0c1.5-4 6-4.5 6-1.8C18 9 12 9 12 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="currentColor"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.8" fill="currentColor"/><circle cx="6" cy="12" r="2.8" fill="currentColor"/><circle cx="18" cy="19" r="2.8" fill="currentColor"/><path d="m8.4 10.7 7.2-4.2M8.4 13.3l7.2 4.2" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<script src="/kituzovadasz/static/vendor/leaflet/leaflet.js"></script>
<script src="/kituzovadasz/static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="/kituzovadasz/a/common.459b3441d1.js"></script>
<script src="/kituzovadasz/a/index.0b6912af98.js"></script>

</body>
</html>
